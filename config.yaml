# ==============================================================
# КОНФИГУРАЦИЯ БОТА ЦЕНЗУРЫ И АНТИСПАМА ДЛЯ TELEGRAM
# Подходит для канала https://t.me/vorondolls и любых других каналов
# ==============================================================

# Токен вашего бота от @BotFather (обязательно укажите свой!)
BOT_TOKEN: "9104189084:AAEM1prcZA-v5dug3DmgCI06-V5Senvjljc"

# Список Telegram ID главных администраторов (через запятую)
# Узнать свой ID можно у бота @userinfobot
ADMIN_IDS:
  - 123456789

# ID чата или канала для отправки логов удаленных сообщений (опционально)
# Например: -1001234567890 (оставьте пустым или 0, если не нужно)
LOG_CHAT_ID: 0

# Путь к базе данных SQLite
DATABASE_PATH: "bot_data.sqlite3"

# Настройки по умолчанию для новых групп/каналов:
DEFAULT_ANTI_PORN: true          # Фильтр 18+, порно, эскорт, интим
DEFAULT_ANTI_SPAM: true          # Фильтр спама, скама, рекламы каналов
DEFAULT_ANTI_FLOOD: true         # Ограничение частых сообщений
DEFAULT_ANTI_LINKS: true         # Удаление внешних ссылок и инвайтов
DEFAULT_ANTI_FOREIGN: true       # Блокировка арабских/персидских спам-символов
DEFAULT_ANTI_PROFANITY: true     # Фильтр русского мата
DEFAULT_DELETE_SERVICE: true     # Удалять системные сообщения "пользователь вступил в чат"
DEFAULT_BLOCK_MEDIA: false       # Блокировать любые фото/видео (по умолчанию выкл, для кукол нужны фото)

# Действие при обнаружении нарушения:
# Возможные варианты: "delete" (только удалить), "warn" (варн), "mute_1h" (мут 1 час), "mute_24h" (мут 24ч), "ban" (бан)
DEFAULT_ACTION: "delete"

# Тихий режим (true = тихо удаляет без лишних уведомлений в комментариях)
DEFAULT_SILENT_MODE: true

# Лимиты флуда: не более 4 сообщений за 6 секунд
FLOOD_MESSAGES_LIMIT: 4
FLOOD_WINDOW_SECONDS: 6
MAX_WARNINGS: 3
